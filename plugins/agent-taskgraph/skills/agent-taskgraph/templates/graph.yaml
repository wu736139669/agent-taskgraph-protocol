# 静态任务拓扑。不要在此记录 active/done 等动态状态；动态状态属于 queue + ledger。
version: 1
batch:
  id: "<batch-id>"
  revision: "<graph revision>"
  spec: "<path/to/spec.md>"
  spec_revision: "<frozen revision>"
  approved_by: "<user>"
  approved_at: "<ISO-8601>"
  max_concurrency: 3

nodes:
  - id: "<node-id>"
    title: "<one independently verifiable job>"
    kind: "expert|worker|verifier|merge|human_gate"
    goal_ref: "task:<task-id>"
    needs: []
    consumes: []
    produces: []
    writes: []
    acceptance:
      - "<command or checkable condition>"
    on_pass: "<next-node-id|done>"
    on_fail: "<repair-node-id|failed>"
    max_attempts: 1

# 建图约束：
# - goal_ref 只用稳定 task:<task-id> 或 decision:<stable-id>；禁止写 queue/inbox、active 等动态路径。
# - needs 只包含真实数据依赖；下游不读取上游产物就不要画边。
# - consumes 命中其他节点 produces/writes 时，生产节点必须位于 needs 的祖先链。
# - 并行节点的 writes 不得重叠；最终整合只能有一个 merge owner。
# - verifier 使用独立上下文；失败回到最早失败边界对应的最小修复节点。
# - 每个循环必须有 max_attempts；不可逆动作建 human_gate 节点。
# - needs/consumes/produces/writes 使用本模板的 JSON-compatible inline list，生成后运行 scripts/validate-graph.py。
