<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Agent TaskGraph Protocol</title>
  <desc id="desc">Graph engineering for complex AI coding work, from repository context to verified delivery.</desc>
  <rect width="1600" height="900" fill="#111827"/>
  <path d="M0 124H1600M0 742H1600" stroke="#263449" stroke-width="2"/>

  <text x="104" y="194" fill="#f8fafc" font-family="Arial, Helvetica, sans-serif" font-size="72" font-weight="700">AGENT TASKGRAPH</text>
  <text x="108" y="258" fill="#a7f3d0" font-family="Arial, Helvetica, sans-serif" font-size="28">GRAPH ENGINEERING FOR COMPLEX AI CODING WORK</text>
  <text x="108" y="320" fill="#cbd5e1" font-family="Arial, Helvetica, sans-serif" font-size="25">Context first. Frozen scope. Bounded workers. Independent review. Human-owned gates.</text>

  <g fill="none" stroke="#64748b" stroke-width="5" stroke-linecap="round">
    <path d="M284 520H414"/>
    <path d="M584 520H714"/>
    <path d="M884 520H1014"/>
    <path d="M1184 520H1314"/>
  </g>
  <g fill="#64748b">
    <path d="M414 520l-20-14v28z"/>
    <path d="M714 520l-20-14v28z"/>
    <path d="M1014 520l-20-14v28z"/>
    <path d="M1314 520l-20-14v28z"/>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <g>
      <rect x="84" y="445" width="220" height="150" rx="8" fill="#fef3c7"/>
      <circle cx="194" cy="480" r="13" fill="#f59e0b"/>
      <text x="194" y="532" fill="#422006" font-size="25" font-weight="700">CONTEXT</text>
      <text x="194" y="566" fill="#78350f" font-size="18">inspect the repo</text>
    </g>
    <g>
      <rect x="384" y="445" width="220" height="150" rx="8" fill="#dbeafe"/>
      <circle cx="494" cy="480" r="13" fill="#2563eb"/>
      <text x="494" y="532" fill="#172554" font-size="25" font-weight="700">SPEC</text>
      <text x="494" y="566" fill="#1e3a8a" font-size="18">clarify and freeze</text>
    </g>
    <g>
      <rect x="684" y="445" width="220" height="150" rx="8" fill="#dcfce7"/>
      <circle cx="794" cy="480" r="13" fill="#16a34a"/>
      <text x="794" y="532" fill="#052e16" font-size="25" font-weight="700">GRAPH</text>
      <text x="794" y="566" fill="#166534" font-size="18">model real work</text>
    </g>
    <g>
      <rect x="984" y="445" width="220" height="150" rx="8" fill="#fce7f3"/>
      <circle cx="1094" cy="480" r="13" fill="#db2777"/>
      <text x="1094" y="532" fill="#500724" font-size="25" font-weight="700">WORKERS</text>
      <text x="1094" y="566" fill="#9d174d" font-size="18">execute bounded goals</text>
    </g>
    <g>
      <rect x="1284" y="445" width="220" height="150" rx="8" fill="#ede9fe"/>
      <circle cx="1394" cy="480" r="13" fill="#7c3aed"/>
      <text x="1394" y="532" fill="#2e1065" font-size="25" font-weight="700">VERIFY</text>
      <text x="1394" y="566" fill="#5b21b6" font-size="18">evidence + gate</text>
    </g>
  </g>

  <text x="108" y="694" fill="#94a3b8" font-family="Arial, Helvetica, sans-serif" font-size="22">SMALL TASKS STAY FAST. COMPLEX TASKS BECOME EXPLICIT.</text>
  <text x="108" y="814" fill="#a7f3d0" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700">OPEN SOURCE  /  PUBLIC BETA</text>
  <text x="1492" y="814" fill="#cbd5e1" font-family="Arial, Helvetica, sans-serif" font-size="21" text-anchor="end">github.com/wu736139669/agent-taskgraph-protocol</text>
</svg>
